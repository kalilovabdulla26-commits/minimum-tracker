<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Минимум трекер</title>
<meta name="description" content="Жумалык минимум, зикрлер жана тасбих">
<meta name="theme-color" content="#127356">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Минимум">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<script src="/config.js"></script>
<style>
html{scroll-padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* Layout: native-app shell — header, date strip, zikr row, 2-col task cards; fixed bottom nav; bottom sheets + full-screen tasbih */
:root{
  --bg:#eef3f1; --card:#ffffff; --card2:#f5f8f7; --fg:#10201b; --muted:#66786f; --line:#e0e8e4;
  --accent:#127356; --accent-ink:#ffffff; --accent-soft:#dcefe7; --gold:#c08a1c; --gold-soft:#f8eed6; --bad:#c2513a; --bad-soft:#f9e4de;
  --bead:#d4ddd9; --shadow:0 1px 2px rgba(16,32,27,.06),0 4px 14px rgba(16,32,27,.06);
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1714; --card:#13231e; --card2:#183029; --fg:#eaf2ee; --muted:#8fa69c; --line:#21362f;
  --accent:#3cc08f; --accent-ink:#06261b; --accent-soft:#163b2e; --gold:#e6bb57; --gold-soft:#3a2f15; --bad:#ec7b62; --bad-soft:#3d2018;
  --bead:#2a3f38; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1714; --card:#13231e; --card2:#183029; --fg:#eaf2ee; --muted:#8fa69c; --line:#21362f;
  --accent:#3cc08f; --accent-ink:#06261b; --accent-soft:#163b2e; --gold:#e6bb57; --gold-soft:#3a2f15; --bad:#ec7b62; --bad-soft:#3d2018;
  --bead:#2a3f38; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;font-weight:600;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.sm{font-size:12.5px}

/* header */
.head{display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.ava{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.who div{min-width:0}
.who b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hello{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b::after{content:" ▾";color:var(--muted);font-size:12px}
.score{display:flex;align-items:center;gap:8px}
.score .lbl{text-align:right;line-height:1.15}
.score .lbl b{display:block;font-size:12px;color:var(--muted);font-weight:700}
.hbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);flex:none}
.hbtn svg{width:20px;height:20px}

/* install banner */
.inst{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:12px 12px 12px 14px;box-shadow:var(--shadow)}
.inst img{width:42px;height:42px;border-radius:11px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.inst .tx{flex:1;min-width:0;line-height:1.2}
.inst .tx b{display:block;font-size:15px;font-weight:900}
.inst .tx span{font-size:12.5px;opacity:.85}
.inst .go{background:var(--accent-ink);color:var(--accent);border-radius:999px;padding:9px 14px;font-weight:900;font-size:14px;flex:none}
.inst .x{width:28px;height:28px;border-radius:50%;opacity:.75;font-size:16px;flex:none}

/* date strip */
.strip{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:center}
.arrow{width:28px;height:44px;border-radius:10px;color:var(--muted);font-size:20px}
.d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px}
.d small{font-size:11px;color:var(--muted);font-weight:700}
.d b{font-size:16px;font-weight:800}
.d i{width:5px;height:5px;border-radius:50%;background:transparent}
.d i.has{background:var(--gold)}
.d.on{background:var(--accent);color:var(--accent-ink)}
.d.on small{color:inherit;opacity:.8}
.d.on i.has{background:var(--accent-ink)}
.d.today:not(.on) b{color:var(--accent)}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:-6px}
.sec h2{margin:0;font-size:18px;font-weight:900}
.link{color:var(--accent);font-weight:800;font-size:14px;padding:6px 2px}

/* zikr */
.zrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.zrow::-webkit-scrollbar{display:none}
.zb{flex:none;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px}
.zb .c{position:relative;width:84px;height:84px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.zb .c svg{position:absolute;inset:0}
.zb .c b{font-size:20px;font-weight:900;position:relative}
.zb span{font-size:13px;font-weight:700;text-align:center;line-height:1.15;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zb.add .c{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-size:28px}

/* task cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.card .t{font-size:15px;font-weight:800;line-height:1.2;min-height:2.4em}
.card .n{display:flex;align-items:baseline;gap:4px}
.card .n b{font-size:26px;font-weight:900;line-height:1}
.card .n span{color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar div{height:100%;border-radius:3px;background:var(--gold)}
.card.done{background:var(--accent-soft)}
.card.done .bar div{background:var(--accent)}
.card .ok{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:900}
.card .today{font-size:12px;color:var(--muted)}
.card .today b{color:var(--fg)}

/* stats */
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:15px;font-weight:800}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.chart{width:100%;height:auto;display:block}
.li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li .bar{margin-top:6px}
.chip{display:inline-block;min-width:48px;text-align:center;border-radius:999px;padding:3px 8px;font-size:12.5px;font-weight:800}
.g{background:var(--accent-soft);color:var(--accent)} .y{background:var(--gold-soft);color:var(--gold)} .r{background:var(--bad-soft);color:var(--bad)}
.up{color:var(--accent);font-weight:800}.down{color:var(--bad);font-weight:800}.eq{color:var(--muted)}
.tr{min-width:40px;text-align:right;font-size:13px}
.rk{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0}
.rk .pl{font-weight:900;font-size:16px;color:var(--muted);text-align:center}
.rk.top .pl{color:var(--gold)}
.rk.me b{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:16px 8px;font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:6px max(14px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:800}
.nav svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,15,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:20px;font-weight:900;text-align:center}
.sheet .sub{text-align:center;color:var(--muted);margin-top:-8px}
.counter{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px}
.rbtn{width:64px;height:64px;border-radius:50%;background:var(--card2);font-size:30px;font-weight:700;display:grid;place-items:center}
.rbtn.pl{background:var(--accent);color:var(--accent-ink)}
.counter input{width:100%;text-align:center;font-size:52px;font-weight:900;border:0;background:transparent;-moz-appearance:textfield;padding:0}
.counter input::-webkit-outer-spin-button,.counter input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--card2);border-radius:14px;padding:12px 0;font-weight:800}
.wide{width:100%;border-radius:16px;padding:15px;font-weight:800;font-size:16px;background:var(--card2)}
.wide.pri{background:var(--accent);color:var(--accent-ink)}
.field{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:700}
.plist button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);text-align:left;font-weight:800}
.plist button:first-child{border-top:0}
.plist .ava{width:36px;height:36px;font-size:15px}
.plist .cur{margin-left:auto;color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 100px;gap:8px}

/* install help */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--card2);border-radius:16px;padding:12px}
.steps .num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900}
.steps .ic{display:inline-grid;place-items:center;vertical-align:-6px;width:26px;height:26px;border-radius:7px;background:var(--card);color:#0a7cff;margin:0 2px;box-shadow:var(--shadow)}
.steps .ic svg{width:17px;height:17px}
.steps .lb{display:inline-block;background:var(--card);border-radius:8px;padding:1px 7px;font-weight:800;box-shadow:var(--shadow)}
.pointer{text-align:center;font-size:30px;line-height:1;color:var(--accent);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* tasbih */
.tas{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));transition:background .3s}
.tas.flash{background:var(--accent-soft)}
.tbar{width:100%;max-width:520px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.tbar h3{margin:0;text-align:center;font-size:19px;font-weight:900}
.ib{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.tgoal{margin-top:4px;color:var(--muted);text-align:center}
.tap{flex:1;width:100%;max-width:520px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tap svg{width:min(90vw,60vh,420px);height:auto;overflow:visible}
@keyframes pop{50%{transform:scale(.965)}}
.tap.p svg{animation:pop .11s}
.tfoot{width:100%;max-width:520px;display:flex;justify-content:center;gap:10px}
.pill{border-radius:999px;padding:12px 18px;background:var(--card);box-shadow:var(--shadow);font-weight:800}
@media (prefers-reduced-motion:reduce){.tap.p svg,.sheet,.pointer{animation:none}.tas{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header class="head">
    <button class="who" id="whoBtn"><span class="ava" id="ava">?</span><div><span class="muted sm" id="hello">Ассалому алейкум</span><b id="whoName">Атыңызды тандаңыз</b></div></button>
    <button class="hbtn" id="instBtn" hidden aria-label="Башкы экранга кошуу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3M10 18.5h4"/></svg></button>
    <div class="score"><div class="lbl"><b>ЖУМА</b><span class="sm muted" id="statusTxt"></span></div><div id="scoreRing"></div></div>
  </header>

  <div class="inst" id="instBanner" hidden>
    <img src="/icon-192.png" alt="">
    <div class="tx"><b>Телефонго орнотуу</b><span>Башкы экранга кошуп, тиркеме катары ачыңыз</span></div>
    <button class="go" id="instGo">Кошуу</button>
    <button class="x" id="instX" aria-label="Жабуу">✕</button>
  </div>

  <!-- TODAY -->
  <section id="v-today" style="display:flex;flex-direction:column;gap:16px">
    <div class="strip" id="strip"></div>

    <div class="sec"><h2>Зикрлер</h2><span class="muted sm">күнүнө</span></div>
    <div class="zrow" id="zrow"></div>

    <div class="sec"><h2 id="dayTitle">Бүгүн</h2><span class="muted sm">жумалык минимум</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- STATS -->
  <section id="v-stats" hidden style="flex-direction:column;gap:14px">
    <div class="sec"><h2>Статистика</h2><span class="muted sm" id="stWeek"></span></div>
    <div class="kpis">
      <div class="kpi"><span class="muted sm">Ушул жума</span><b id="kNow">0%</b></div>
      <div class="kpi"><span class="muted sm">Өткөн жумага</span><b id="kDelta">0</b></div>
    </div>
    <div class="panel"><h3>Акыркы 8 жума</h3><svg class="chart" id="lineChart" viewBox="0 0 340 170" role="img" aria-label="8 жумадагы аткаруу пайызы"></svg></div>
    <div class="panel"><h3>Ушул жуманын күндөрү</h3><svg class="chart" id="barChart" viewBox="0 0 340 150" role="img" aria-label="Күн сайын белгиленген иштер"></svg></div>
    <div class="panel"><h3>Ар бир иш · прогресс / регресс</h3><div id="perItem"></div></div>
  </section>

  <!-- RANK -->
  <section id="v-rank" hidden style="flex-direction:column;gap:14px">
    <div class="sec"><h2>Рейтинг</h2><span class="muted sm">ушул жума</span></div>
    <div class="panel" id="rank"></div>
  </section>
</div>

<nav class="nav"><div id="nav">
  <button data-t="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Бүгүн</button>
  <button data-t="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Статистика</button>
  <button data-t="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Рейтинг</button>
</div></nav>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="tas" id="tas" hidden>
  <div class="tbar"><button class="ib" id="tClose" aria-label="Жабуу">✕</button><h3 id="tName"></h3><button class="ib" id="tSound" aria-label="Үн">🔔</button></div>
  <div class="tgoal" id="tGoal"></div>
  <button class="tap" id="tTap" aria-label="Санау"><svg id="tSvg" viewBox="0 0 300 300"></svg></button>
  <div class="tfoot"><button class="pill" id="tUndo">↶ −1</button><button class="pill" id="tReset">Нөлгө</button></div>
</div>

<script>
const ITEMS=[
 {k:"kk",n:"Курани Карим",min:5,u:"бет"},
 {k:"jvsh",n:"Жевшен",min:1,u:"бап",tas:true},
 {k:"rus",n:"Рисале-и Нур",min:21,u:"бет"},
 {k:"prt",n:"Пырланта",min:35,u:"бет"},
 {k:"thj",n:"Тахажжуд",min:2,u:"жолу"},
 {k:"orz",n:"Орозо",min:1,u:"күн"},
 {k:"kino",n:"Уаз",min:30,u:"мүн"},
 {k:"mzk",n:"МЗК",min:21,u:""},
 {k:"avb",n:"Авабин намазы",min:3,u:"жолу"},
 {k:"kn",n:"Каза намаз",min:1,u:"күндүк",hint:"Бир күндүк намаз толук окулса — 1"},
 {k:"adb",n:"Адабият",min:30,u:"бет"},
 {k:"jto",n:"Жаттоо",min:1,u:""},
 {k:"sbk",n:"Сабак кароо",min:5,u:""},
];
const DEF_Z=[{id:"istg",n:"Истигфар",goal:100},{id:"slv",n:"Салават",goal:100},{id:"tsb",n:"Тасбихат",goal:2,round:99}];
const TSB_PH=["Субханаллах","Алхамдулиллах","Аллаху акбар"];
const zv=(q,c)=>q.round?Math.floor(c/q.round):c; // tasbihat: 99 мончок = 1 жолу
const DAYS=["ВС","ПН","ВТ","СР","ЧТ","ПТ","СБ"];
const DAYS_LONG=["Жекшемби","Дүйшөмбү","Шейшемби","Шаршемби","Бейшемби","Жума","Ишемби"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function weekStartOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()-3+7)%7));return x}
const fmt=d=>d.getDate()+"."+pad(d.getMonth()+1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let db=null,mode="local",people=[],entries={};
let me=store.get("mt_person")||"",selDate=iso(new Date()),tab="today",sound=store.get("mt_sound")!=="0";
let unsubWeek=null,unsubMine=null,mineFor="";
const timers={};
let sheetItem=null;

const setStatus=t=>{$("statusTxt").textContent=t};
function localLoad(){try{const o=JSON.parse(store.get("mt_data")||"{}");people=o.people||[];entries=o.entries||{}}catch(e){}}
function localSave(){store.set("mt_data",JSON.stringify({people,entries}))}
const meObj=()=>people.find(p=>p.id===me);
const zikrsOf=()=>(meObj()?.zikrs||DEF_Z).map(q=>q.id==="tsb"?DEF_Z[2]:q);
const valsOn=(pid,ds)=>entries[pid+"_"+ds]?.values||{};
function weekSums(pid,ws){const t={};for(let i=0;i<7;i++){const v=valsOn(pid,iso(addDays(ws,i)));for(const k in v)t[k]=(t[k]||0)+(+v[k]||0)}return t}
function weekPct(pid,ws){const t=weekSums(pid,ws);return Math.round(ITEMS.reduce((a,it)=>a+Math.min(1,(t[it.k]||0)/it.min),0)/ITEMS.length*100)}
const cls=p=>p>=100?"g":p>=50?"y":"r";
const curWs=()=>weekStartOf(fromIso(selDate));

function ring(p,size,stroke,color,inner=""){
  const r=(size-stroke)/2,c=2*Math.PI*r,o=c*(1-Math.min(1,Math.max(0,p)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${o.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>${inner}</svg>`;
}

// ---------------- render ----------------
function render(){
  if(me&&!people.some(p=>p.id===me))me="";
  if(!me&&people.length){me=[...people].sort((a,b)=>a.name.localeCompare(b.name,"ky"))[0].id}
  const p=meObj();
  $("whoName").textContent=p?p.name:"Атыңызды кошуңуз";
  $("ava").textContent=p?p.name.trim()[0].toUpperCase():"+";
  const sc=p?weekPct(me,curWs()):0;
  $("scoreRing").innerHTML=ring(sc/100,46,5,sc>=100?"var(--accent)":"var(--gold)",`<text x="23" y="27.5" text-anchor="middle" font-size="12.5" font-weight="900" fill="var(--fg)">${sc}%</text>`);

  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  ["today","stats","rank"].forEach(t=>{const s=$("v-"+t);s.hidden=t!==tab;if(t===tab)s.style.display="flex"});
  if(tab==="today")renderToday();
  if(tab==="stats")renderStats();
  if(tab==="rank")renderRank();
  if(sheetItem)drawItemSheet();
  if(!$("tas").hidden)drawTas();
}

function renderToday(){
  const ws=curWs(),today=iso(new Date());
  let s=`<button class="arrow" data-w="-1" aria-label="Мурунку жума">‹</button>`;
  for(let i=0;i<7;i++){const d=addDays(ws,i),ds=iso(d),has=Object.values(valsOn(me,ds)).some(x=>+x>0);
    s+=`<button class="d${ds===selDate?" on":""}${ds===today?" today":""}" data-d="${ds}"><small>${DAYS[d.getDay()]}</small><b>${d.getDate()}</b><i class="${has?"has":""}"></i></button>`}
  s+=`<button class="arrow" data-w="1" aria-label="Кийинки жума">›</button>`;
  $("strip").innerHTML=s;
  const sd=fromIso(selDate);
  $("dayTitle").textContent=selDate===today?"Бүгүн":DAYS_LONG[sd.getDay()]+", "+fmt(sd);

  const vals=valsOn(me,selDate);
  let z="";
  zikrsOf().forEach(q=>{const raw=+vals["z_"+q.id]||0,c=zv(q,raw),done=c>=q.goal,frac=q.round?(raw/q.round)/q.goal:c/q.goal;
    z+=`<button class="zb" data-z="${esc(q.id)}"><span class="c">${ring(frac,84,6,done?"var(--accent)":"var(--gold)")}<b>${done&&!q.round?"✓":c}</b></span><span>${esc(q.n)}</span><span class="muted sm" style="margin-top:-6px">${c}/${q.goal}${q.round?" жолу":""}${done?" ✓":""}</span></button>`});
  z+=`<button class="zb add" id="zAdd"><span class="c">+</span><span class="muted">Кошуу</span></button>`;
  $("zrow").innerHTML=z;

  const sums=weekSums(me,ws);
  let g="";
  ITEMS.forEach(it=>{const w=sums[it.k]||0,t=+vals[it.k]||0,done=w>=it.min;
    g+=`<button class="card${done?" done":""}" data-k="${it.k}">${done?'<span class="ok">✓</span>':""}<span class="t">${it.n}</span>
      <span class="n"><b>${w}</b><span>/ ${it.min} ${it.u}</span></span>
      <span class="bar"><div style="width:${Math.min(100,w/it.min*100)}%"></div></span>
      <span class="today">${selDate===today?"Бүгүн":"Ушул күнү"}: <b>${t}</b></span></button>`});
  $("grid").innerHTML=g;
}

function renderStats(){
  const ws=curWs();
  $("stWeek").textContent=fmt(ws)+" – "+fmt(addDays(ws,6));
  const weeks=[];for(let i=7;i>=0;i--){const w=addDays(ws,-7*i);weeks.push({w,p:weekPct(me,w)})}
  const now=weeks[7].p,d=now-weeks[6].p;
  $("kNow").textContent=now+"%";
  $("kDelta").innerHTML=d>0?`<span class="up">↑ ${d}</span>`:d<0?`<span class="down">↓ ${-d}</span>`:`<span class="eq">0</span>`;

  const L=34,R=330,T=14,B=140,x=i=>L+i*(R-L)/7,y=p=>B-(p/100)*(B-T);
  let s="";
  [0,50,100].forEach(g=>{s+=`<line x1="${L}" x2="${R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${g}%</text>`});
  const pts=weeks.map((o,i)=>[x(i),y(o.p)]);
  s+=`<path d="M${pts[0][0]},${B} L${pts.map(p=>p.join(",")).join(" L")} L${pts[7][0]},${B} Z" fill="var(--accent-soft)"/>`;
  s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{const last=i===7;s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last?5:3}" fill="${last?"var(--accent)":"var(--card)"}" stroke="var(--accent)" stroke-width="2"/><text x="${p[0]}" y="${B+16}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${fmt(weeks[i].w)}</text>`});
  s+=`<text x="${pts[7][0]}" y="${Math.max(11,pts[7][1]-9)}" text-anchor="end" font-size="11" font-weight="800" fill="var(--accent)">${now}%</text>`;
  $("lineChart").innerHTML=s;

  const cnt=[];for(let i=0;i<7;i++){const v=valsOn(me,iso(addDays(ws,i)));cnt.push(ITEMS.filter(it=>+v[it.k]>0).length)}
  const mx=ITEMS.length,bw=(R-L)/7,BB=120,yb=c=>BB-(c/mx)*(BB-12);
  let b="";[0,Math.round(mx/2),mx].forEach(g=>{b+=`<line x1="${L}" x2="${R}" y1="${yb(g)}" y2="${yb(g)}" stroke="var(--line)"/><text x="${L-6}" y="${yb(g)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${g}</text>`});
  cnt.forEach((c,i)=>{const dd=addDays(ws,i),cx=L+i*bw+bw*.2,h=BB-yb(c);
    b+=`<rect x="${cx}" y="${yb(c)}" width="${bw*.6}" height="${Math.max(0,h)}" rx="5" fill="${iso(dd)===selDate?"var(--accent)":"var(--gold)"}"/>`;
    if(c)b+=`<text x="${cx+bw*.3}" y="${yb(c)-4}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)">${c}</text>`;
    b+=`<text x="${cx+bw*.3}" y="${BB+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${DAYS[dd.getDay()]}</text>`});
  $("barChart").innerHTML=b;

  const t=weekSums(me,ws),pt=weekSums(me,addDays(ws,-7));
  const rows=[...ITEMS.map(it=>({n:it.n,a:t[it.k]||0,b:pt[it.k]||0,g:it.min})),...zikrsOf().map(q=>({n:q.n+(q.round?" (жолу)":""),a:zv(q,t["z_"+q.id]||0),b:zv(q,pt["z_"+q.id]||0),g:q.goal*7}))];
  $("perItem").innerHTML=rows.map(r=>{const p=Math.round(r.a/r.g*100);
    const tr=r.a>r.b?`<span class="up">↑${r.a-r.b}</span>`:r.a<r.b?`<span class="down">↓${r.b-r.a}</span>`:`<span class="eq">=</span>`;
    return `<div class="li"><div><div>${esc(r.n)} <span class="muted sm">${r.a}/${r.g}</span></div><div class="bar"><div style="width:${Math.min(100,p)}%;background:var(--${p>=100?"accent":"gold"})"></div></div></div><span class="chip ${cls(p)}">${p}%</span><span class="tr">${tr}</span></div>`}).join("");
}

function renderRank(){
  const ws=curWs();
  const rows=people.map(p=>({p,pct:weekPct(p.id,ws)})).sort((a,b)=>b.pct-a.pct);
  const r=$("rank");
  if(!rows.length){r.innerHTML='<div class="empty">Азырынча эч ким жок.</div>';return}
  r.innerHTML="";
  rows.forEach((x,i)=>{const d=document.createElement("div");d.className="rk"+(x.p.id===me?" me":"")+(i<3&&x.pct>0?" top":"");
    d.innerHTML=`<span class="pl">${i+1}</span><div><b></b><div class="bar" style="margin-top:6px"><div style="width:${x.pct}%;background:var(--accent)"></div></div></div><span class="chip ${cls(x.pct)}">${x.pct}%</span>`;
    d.querySelector("b").textContent=x.p.name;r.appendChild(d)});
}

// ---------------- sheets ----------------
function openSheet(html,after){$("sheet").innerHTML='<div class="grab"></div>'+html;$("scrim").hidden=false;document.body.style.overflow="hidden";after&&after()}
function closeSheet(){$("scrim").hidden=true;document.body.style.overflow="";sheetItem=null;render()}
$("scrim").addEventListener("click",e=>{if(e.target===$("scrim"))closeSheet()});

function openItem(k){if(!me){openPeople();return}sheetItem=ITEMS.find(i=>i.k===k);openSheet("",drawItemSheet)}
function drawItemSheet(){
  const it=sheetItem,ws=curWs(),w=weekSums(me,ws)[it.k]||0,t=+valsOn(me,selDate)[it.k]||0,done=w>=it.min;
  const focused=document.activeElement?.id==="cIn";
  const html=`<div class="grab"></div><h3>${it.n}</h3><div class="sub">${selDate===iso(new Date())?"Бүгүн":fmt(fromIso(selDate))} · ${it.u||"саны"}</div>
    <div class="counter"><button class="rbtn" id="cMinus" aria-label="Азайтуу">−</button><input id="cIn" type="number" inputmode="numeric" min="0" value="${t}"><button class="rbtn pl" id="cPlus" aria-label="Көбөйтүү">+</button></div>
    <div class="quick">${[1,5,10,20].map(n=>`<button data-q="${n}">+${n}</button>`).join("")}</div>
    <div><div style="display:flex;justify-content:space-between"><span>Жума: <b>${w} / ${it.min}</b> ${it.u}</span><span class="${done?"up":"muted"}">${done?"Минимум ✓":Math.max(0,it.min-w)+" калды"}</span></div><div class="bar" style="margin-top:8px"><div style="width:${Math.min(100,w/it.min*100)}%;background:var(--${done?"accent":"gold"})"></div></div></div>
    ${it.hint?`<div class="muted sm" style="text-align:center">${it.hint}</div>`:""}
    <button class="wide" id="cTas">📿 Тасбих менен санау</button>
    <button class="wide pri" id="cDone">Даяр</button>`;
  $("sheet").innerHTML=html;
  const set=v=>change(it.k,Math.max(0,v));
  $("cMinus").onclick=()=>set(t-1);$("cPlus").onclick=()=>set(t+1);
  $("sheet").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>set(t+ +b.dataset.q));
  $("cIn").onchange=e=>set(Math.floor(+e.target.value||0));
  $("cTas").onclick=()=>{const x=it;closeSheet();openTas({key:x.k,name:x.n,goal:x.min,weekly:true,u:x.u})};
  $("cDone").onclick=closeSheet;
  if(focused){const f=$("cIn");f.focus()}
}

function openPeople(){
  const list=[...people].sort((a,b)=>a.name.localeCompare(b.name,"ky"));
  openSheet(`<h3>Ким толтурат?</h3>
    <div class="plist">${list.map(p=>`<button data-p="${esc(p.id)}"><span class="ava">${esc(p.name.trim()[0].toUpperCase())}</span><span>${esc(p.name)}</span>${p.id===me?'<span class="cur">✓</span>':""}</button>`).join("")||'<div class="empty">Азырынча эч ким жок</div>'}</div>
    <form id="pForm" style="display:flex;flex-direction:column;gap:8px"><input class="field" id="pName" placeholder="Жаңы ат" maxlength="30" autocomplete="off"><button class="wide pri" type="submit">+ Кошуу</button></form>`,()=>{
    $("sheet").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{me=b.dataset.p;store.set("mt_person",me);subscribeMine();closeSheet()});
    $("pForm").addEventListener("submit",e=>{e.preventDefault();addPerson($("pName").value);closeSheet()});
  });
}

function openZikrAdd(){
  if(!me){openPeople();return}
  const zs=zikrsOf();
  openSheet(`<h3>Зикрлер</h3>
    <div class="plist">${zs.map(q=>`<button data-del="${esc(q.id)}"><span>${esc(q.n)}</span><span class="muted" style="margin-left:auto">${q.goal}</span><span class="down" style="margin-left:12px">✕</span></button>`).join("")}</div>
    <form id="zForm" style="display:flex;flex-direction:column;gap:8px"><div class="two"><input class="field" id="zName" placeholder="Аты (мис. Кәлимаи тайиба)" maxlength="24" autocomplete="off"><input class="field" id="zGoal" type="number" inputmode="numeric" placeholder="Норма"></div><button class="wide pri" type="submit">+ Зикр кошуу</button></form>`,()=>{
    $("sheet").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const p=meObj();p.zikrs=zikrsOf().filter(q=>q.id!==b.dataset.del);savePerson(p);openZikrAdd()});
    $("zForm").addEventListener("submit",e=>{e.preventDefault();const p=meObj(),n=$("zName").value.trim(),g=Math.floor(+$("zGoal").value||0);
      if(!n||g<1)return;p.zikrs=[...zikrsOf(),{id:"z"+Date.now().toString(36),n,goal:g}];savePerson(p);closeSheet()});
  });
}

// ---------------- writes ----------------
function change(k,val){
  if(!me){openPeople();return}
  const id=me+"_"+selDate,ws=iso(curWs());
  const e=entries[id]||{person:me,date:selDate,weekStart:ws,values:{}};
  e.values={...e.values,[k]:val};entries[id]=e;render();
  if(mode==="local"){localSave();return}
  clearTimeout(timers[id]);setStatus("сакталууда…");
  timers[id]=setTimeout(()=>{delete timers[id];
    db.collection("entries").doc(id).set({person:e.person,date:e.date,weekStart:e.weekStart,values:e.values})
      .then(()=>setStatus("сакталды ✓")).catch(err=>setStatus(err?.code==="not_granted"||err?.code==="permission-denied"?"уруксат жок":"сакталбады"))},700);
}
async function savePerson(p){
  render();
  if(mode==="local"){localSave();return}
  try{await db.collection("people").doc(p.id).set({name:p.name,...(p.zikrs?{zikrs:p.zikrs}:{})});setStatus("сакталды ✓")}catch(e){setStatus("сакталбады")}
}
function addPerson(name){
  name=name.trim();if(!name)return;
  const same=people.find(p=>p.name.toLowerCase()===name.toLowerCase());
  const id=same?same.id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(!same)people.push({id,name});
  me=id;store.set("mt_person",me);subscribeMine();if(!same)savePerson(meObj());else render();
}

// ---------------- tasbih ----------------
let T=null,actx=null;
function openTas(o){if(!me){openPeople();return}T=o;$("tas").hidden=false;document.body.style.overflow="hidden";drawTas()}
function closeTas(){$("tas").hidden=true;document.body.style.overflow="";T=null;render()}
const tasCount=()=>+valsOn(me,selDate)[T.key]||0;
const tasWeek=()=>weekSums(me,curWs())[T.key]||0;
function drawTas(){
  if(!T)return;
  const raw=tasCount(),rd=T.round,c=rd?raw%rd:raw,rounds=rd?Math.floor(raw/rd):0;
  const prog=T.weekly?tasWeek():rd?raw/rd:raw,goal=T.goal,done=prog>=goal;
  $("tName").textContent=T.name;
  $("tGoal").textContent=T.weekly?`Бүгүн ${raw} · жума ${prog}/${goal} ${T.u||""}`:rd?`Бүгүн ${rounds} жолу · норма ${goal} жолу · ${TSB_PH[Math.min(2,Math.floor(c/33))]}`:`Норма: ${goal}`;
  $("tSound").textContent=sound?"🔔":"🔕";
  const N=33,cx=150,cy=150,R=132,lit=c===0?0:(c%N===0?N:c%N);let s="";
  for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N,bx=cx+R*Math.cos(a),by=cy+R*Math.sin(a),on=i<lit;
    s+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${on?9.5:7.5}" fill="${on?(done?"var(--accent)":"var(--gold)"):"var(--bead)"}"/>`}
  const r2=102,circ=2*Math.PI*r2,off=circ*(1-Math.min(1,prog/goal));
  s+=`<circle cx="${cx}" cy="${cy}" r="${r2}" fill="var(--card)" stroke="var(--line)" stroke-width="9"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="${done?"var(--accent)":"var(--gold)"}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
  s+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-size="${c>999?48:64}" font-weight="900" fill="var(--fg)">${c}</text>`;
  const sub=rd?(done?`${rounds} жолу ✓ · `:"")+(c===0&&rounds?"жаңы тасбихат":`${c}/99`):(done?"Норма толду ✓":"басыңыз");
  s+=`<text x="${cx}" y="${cy+46}" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-size="14" font-weight="700" fill="${done?"var(--accent)":"var(--muted)"}">${sub}</text>`;
  $("tSvg").innerHTML=s;
}
function beep(){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,.18].forEach((t,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i?1046:784;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.25);
    o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.3)})}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
$("tTap").addEventListener("click",()=>{
  if(!T)return;const rd=T.round,f=x=>rd?Math.floor(x/rd):x;
  const before=f(T.weekly?tasWeek():tasCount());
  change(T.key,tasCount()+1);
  const after=f(T.weekly?tasWeek():tasCount());
  const tap=$("tTap");tap.classList.remove("p");void tap.offsetWidth;tap.classList.add("p");
  if(rd&&after>before&&after<T.goal){buzz([150,60,150]);beep()}
  else if(before<T.goal&&after>=T.goal){buzz([200,80,200]);beep();const el=$("tas");el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),900)}
  else if(tasCount()%33===0)buzz(60);else buzz(12);
});
$("tUndo").onclick=()=>{if(T&&tasCount()>0)change(T.key,tasCount()-1)};
$("tReset").onclick=()=>{if(!T)return;const b=$("tReset");if(b.dataset.c){change(T.key,0);delete b.dataset.c;b.textContent="Нөлгө"}else{b.dataset.c="1";b.textContent="Ырастоо?";setTimeout(()=>{delete b.dataset.c;b.textContent="Нөлгө"},2500)}};
$("tClose").onclick=closeTas;
$("tSound").onclick=()=>{sound=!sound;store.set("mt_sound",sound?"1":"0");drawTas()};

// ---------------- install (башкы экранга кошуу) ----------------
const UA=navigator.userAgent;
const isIOS=/iPad|iPhone|iPod/.test(UA)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isAndroid=/Android/i.test(UA);
const inApp=/FBAN|FBAV|Instagram|Telegram|WhatsApp|Line\/|TikTok|; wv\)/i.test(UA);
const iosBrowser=/CriOS/.test(UA)?"Chrome":/FxiOS/.test(UA)?"Firefox":/EdgiOS/.test(UA)?"Edge":"Safari";
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let installEvt=null;
const ICON_SHARE='<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg></span>';
const ICON_ADD='<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></span>';
const ICON_DOTS='<span class="ic" style="color:var(--fg)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>';

function updInstall(){
  const show=!isStandalone();
  $("instBtn").hidden=!show;
  $("instBanner").hidden=!show||store.get("mt_inst_x")==="1";
}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;updInstall()});
addEventListener("appinstalled",()=>{installEvt=null;closeSheet();updInstall()});

async function doInstall(){
  if(installEvt){
    installEvt.prompt();
    try{await installEvt.userChoice}catch(e){}
    installEvt=null;updInstall();return;
  }
  openInstallHelp();
}

function openInstallHelp(){
  const li=(n,html)=>`<li><span class="num">${n}</span><span>${html}</span></li>`;
  let title="Башкы экранга кошуу",body="",foot="";
  if(inApp){
    body=`<div class="sub" style="margin-top:0">Бул шилтеме Telegram / Instagram / WhatsApp ичинде ачылды. Орнотуу үчүн аны ${isIOS?"<b>Safari</b>":"<b>Chrome</b>"}'де ачыңыз.</div>
      <ol class="steps">${li(1,`Жогору жактагы ${ICON_DOTS} же ${ICON_SHARE} баскычын басыңыз`)}${li(2,`<span class="lb">${isIOS?"Открыть в Safari":"Открыть в Chrome"}</span> тандаңыз`)}${li(3,`Ачылгандан кийин <b>«Кошуу»</b> баскычын кайра басыңыз`)}</ol>
      <button class="wide" id="copyLink">🔗 Шилтемени көчүрүү</button>`;
  }else if(isIOS&&iosBrowser==="Safari"){
    body=`<ol class="steps">
      ${li(1,`Төмөнкү панелдеги ${ICON_SHARE} <b>«Бөлүшүү»</b> баскычын басыңыз <span class="muted sm">(көрүнбөсө — алгач ••• басыңыз)</span>`)}
      ${li(2,`Тизмени ылдый сыдырып, ${ICON_ADD} <span class="lb">На экран «Домой»</span> тандаңыз`)}
      ${li(3,`Жогорку оң жактагы <span class="lb">Добавить</span> басыңыз`)}
    </ol>`;
    foot=`<div class="pointer" aria-hidden="true">↓</div>`;
  }else if(isIOS){
    body=`<ol class="steps">
      ${li(1,`Дарек тилкесиндеги ${ICON_SHARE} <b>«Бөлүшүү»</b> баскычын басыңыз <span class="muted sm">(${iosBrowser} — жогору оң жакта; же ••• менюсунда)</span>`)}
      ${li(2,`${ICON_ADD} <span class="lb">На экран «Домой»</span> тандаңыз`)}
      ${li(3,`<span class="lb">Добавить</span> басыңыз`)}
    </ol>
    <div class="muted sm" style="text-align:center">Иштебей калса — бул шилтемени <b>Safari</b>'де ачыңыз.</div>`;
  }else if(isAndroid){
    body=`<ol class="steps">
      ${li(1,`Браузердин жогорку оң жагындагы ${ICON_DOTS} менюну басыңыз`)}
      ${li(2,`<span class="lb">Установить приложение</span> же <span class="lb">Добавить на главный экран</span> тандаңыз`)}
      ${li(3,`<span class="lb">Установить</span> / <span class="lb">Добавить</span> басыңыз`)}
    </ol>`;
  }else{
    title="Телефонго орнотуу";
    body=`<div class="sub" style="margin-top:0">Бул шилтемени телефонуңуздан ачыңыз:<br><b>iPhone</b> — Safari же Chrome, <b>Android</b> — Chrome. Анан «Кошуу» баскычын басыңыз.</div>
      <div class="sub">Компьютерде: Chrome дарек тилкесиндеги орнотуу белгисин басыңыз.</div>
      <button class="wide" id="copyLink">🔗 Шилтемени көчүрүү</button>`;
  }
  openSheet(`<h3>${title}</h3>${body}<button class="wide pri" id="instOk">Түшүндүм</button>${foot}`,()=>{
    $("instOk").onclick=closeSheet;
    const c=$("copyLink");
    if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);c.textContent="✓ Көчүрүлдү"}catch(e){prompt("Шилтеме:",location.href)}};
  });
}
$("instBtn").onclick=doInstall;
$("instGo").onclick=doInstall;
$("instX").onclick=()=>{store.set("mt_inst_x","1");updInstall()};
updInstall();
if("serviceWorker" in navigator&&location.protocol==="https:"){
  addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}

// ---------------- events ----------------
$("whoBtn").onclick=openPeople;
$("nav").onclick=e=>{const t=e.target.closest("button")?.dataset.t;if(t){tab=t;render();window.scrollTo(0,0)}};
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-d]");if(d&&d.closest("#strip")){selDate=d.dataset.d;render();return}
  const w=e.target.closest("[data-w]");if(w){selDate=iso(addDays(fromIso(selDate),7*+w.dataset.w));render();subscribeWeek();return}
  const k=e.target.closest(".card[data-k]");if(k){openItem(k.dataset.k);return}
  const z=e.target.closest(".zb[data-z]");if(z){const q=zikrsOf().find(x=>x.id===z.dataset.z);if(q)openTas({key:"z_"+q.id,name:q.n,goal:q.goal,round:q.round});return}
  if(e.target.closest("#zAdd"))openZikrAdd();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("tas").hidden)closeTas();else if(!$("scrim").hidden)closeSheet()}});

// ---------------- data ----------------
function absorb(snap){snap.docs.forEach(d=>{if(timers[d.id])return;const x=d.data();if(x)entries[d.id]=x});render()}
function subscribeWeek(){if(mode!=="db")return;if(unsubWeek)unsubWeek();
  unsubWeek=db.collection("entries").where("weekStart","==",iso(curWs())).onSnapshot(absorb,()=>setStatus("байланыш жок"))}
function subscribeMine(){if(mode!=="db"||!me||mineFor===me)return;if(unsubMine)unsubMine();mineFor=me;
  unsubMine=db.collection("entries").where("person","==",me).onSnapshot(absorb,()=>{})}

// Firebase (config.js толтурулса — жалпы база, болбосо ушул телефондо)
async function initFirebase(){
  const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.projectId)return null;
  const load=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  const v="10.12.2";
  await load(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
  await load(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
  if(!firebase.apps.length)firebase.initializeApp(cfg);
  const fs=firebase.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  return fs;
}

render();
(async()=>{
  try{db=window.claude?.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){try{db=await initFirebase()}catch(e){db=null}}
  if(!db){mode="local";localLoad();render();setStatus("бул түзмөктө");if(!people.length)openPeople();return}
  mode="db";setStatus("жалпы ✓");let first=true;
  db.collection("people").onSnapshot(snap=>{
    people=snap.docs.map(d=>{const x=d.data()||{};return{id:d.id,name:String(x.name||""),zikrs:Array.isArray(x.zikrs)?x.zikrs:undefined}}).filter(p=>p.name);
    render();subscribeMine();
    if(first){first=false;if(!people.length||!store.get("mt_person"))openPeople()}
  },()=>setStatus("байланыш жок"));
  subscribeWeek();
})();
</script>
